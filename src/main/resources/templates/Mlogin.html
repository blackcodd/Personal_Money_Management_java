<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration & Login</title>
    <!-- Static resources link using Thymeleaf -->
    <link rel="stylesheet" href="/Mloginstyle.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>

<body>
<div class="container">
    <!-- Tab Header -->
    <div class="tab-header">
        <div class="active" data-tab="login">Login</div>
        <div data-tab="register">Register</div>
    </div>

    <!-- Tab Content -->
    <div class="tab-content active" id="login">
        <h2>Login</h2>
        <form th:action="@{/login}" th:object="${user}" method="post">
            <div class="input-group">
                <i class="fas fa-user"></i>
                <input type="text"  th:field="*{name}" placeholder="Username" required>
            </div>
            <div class="input-group">
                <i class="fas fa-lock"></i>
                <input type="password"  th:field="*{password}" placeholder="Password" required>
            </div>
            <p th:if="${message}" th:text="${message}"> </p>
            <button type="submit">Login</button>
            <p>Don't have an account? <a href="#" data-tab="register">Register here</a></p>
        </form>
    </div>

    <div class="tab-content" id="register">
        <h2>Register</h2>
        <form th:action="@{/registration}"  th:method="post" th:object="${user}">
            <div class="input-group">
                <i class="fas fa-user"></i>

                <input th:field="*{name}" type="text" name="name" placeholder="Username" required>

            </div>
            <div class="input-group">
                <i class="fas fa-envelope"></i>
                <input th:field="*{email}" type="email" name="email" placeholder="Email" required>
            </div>
            <div class="input-group">
                <i class="fas fa-lock"></i>
                <input th:field="*{password}" type="password" name="password" placeholder="Password" required>
            </div>
            <button type="submit">Register</button>
            <p>Already have an account? <a href="#login" data-tab="login">Log in here</a></p>
        </form>
    </div>
</div>

<!-- Static JavaScript resource -->
<script src="/Mloginjs.js"></script>
</body>

</html>
