<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transactions</title>
</head>
<body>
<h1>Transaction List</h1>
<table border="1" id="transactionsTable">
    <thead>
    <tr>
        <th>Date</th>
        <th>Type</th>
        <th>Category</th>
        <th>Amount</th>
        <th>Media</th>
    </tr>
    </thead>
    <tbody>
    <!-- Rows will be inserted here -->
    </tbody>
</table>

<script>
    // Fetch the logged-in user ID first
    fetch('/login')
        .then(response => response.json())
        .then(userId => {
            console.log("Logged-in User ID:", userId);

            // Now fetch the transactions using the logged-in user ID
            fetch(`/allTransaction?user_id=${userId}`)
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    return response.json();
                })
                .then(data => {
                    const tableBody = document.querySelector('#transactionsTable tbody');
                    tableBody.innerHTML = ''; // Clear any existing rows

                    // Loop through the data and create table rows
                    data.forEach(transaction => {
                        const row = document.createElement('tr');
                        row.innerHTML = `
                            <td>${transaction.date}</td>
                            <td>${transaction.type}</td>
                            <td>${transaction.category}</td>
                            <td>${transaction.amount}</td>
                            <td>${transaction.media}</td>
                        `;
                        tableBody.appendChild(row); // Append the new row to the table body
                    });
                })
                .catch(error => {
                    console.error('There was a problem with the fetch operation:', error);
                });
        })
        .catch(error => {
            console.error('Failed to fetch logged-in user ID:', error);
        });
</script>
</body>
</html>
