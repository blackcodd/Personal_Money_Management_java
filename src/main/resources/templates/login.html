<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <!-- Link to Font Awesome for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <!-- Link to CSS -->
  <link rel="stylesheet" href="/loginstyle.css">
</head>
<body>
<div class="container">
  <div class="tab-content">
    <h2>Login</h2>
    <form id="loginForm" th:action="@{/login}" th:object="${user}" method="post">
      <div class="input-group">
        <i class="fas fa-user"></i>
        <input type="text" id="name" th:field="*{name}" placeholder="Username" required>
      </div>
      <div class="input-group">
        <i class="fas fa-lock"></i>
        <input type="password" id="password" th:field="*{password}" placeholder="Password" required>
      </div>
      <p th:if="${message}" th:text="${message}"> </p>
      <button type="submit">Login</button>
      <p>Don't have an account?
        <a th:href="@{/registration}" class="switch-tab">Register here</a>
      </p>
    </form>
  </div>
</div>
</body>
</html>
